[project]
name = "aigcd"
version = "0.1.0"
description = "Robust detection of AI-generated images under real-world transformations"
requires-python = ">=3.10"

dependencies = [
    # data acquisition
    "huggingface-hub[cli]>=0.24",
    "modelscope>=1.18",
    "datasets>=2.20",
    "pyarrow>=16",
    # imaging + transforms
    "pillow>=10.3",
    "opencv-python-headless>=4.10",
    "imagehash>=4.3", # phash leakage guard (MD5 misses re-encodes)
    # modelling
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.44",
    "timm>=1.0",
    "diffusers>=0.30", # SD VAE for the reconstruction cue
    # analysis
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5", # linear probe, calibration, risk-coverage
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "mlflow>=3.15.1",
    "wandb>=0.28.2",
    "gradio>=6.26.0",
    "scikit-image>=0.25.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# NSCC's driver is CUDA 12.8, and the default PyPI torch wheel is built against
# a newer CUDA -- it fails with "driver too old" or a missing libcudnn. Pinning
# the index here means `uv sync` gets the right build automatically instead of
# reverting a manual install every time.
#
# Linux only: macOS has no CUDA wheels on that index, so the Mac keeps the
# default build and MPS.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
